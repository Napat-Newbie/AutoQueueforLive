# CI: รันชุดเทสต์ทั้งหมด (tests/README ดูที่ tests/MANUAL_TEST_CHECKLIST.md)
# หมายเหตุ: better-sqlite3 v13.0.3 มี binary prebuild สำหรับ win32-x64 และ linux แล้ว
# ubuntu runner มี python3 + g++ ติดตั้งอยู่แล้ว จึง build ผ่านเสมอ
# Node 24: node:sqlite (ที่ test harness ใช้) เปิดใช้ได้โดยไม่ต้องมี flag
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test
